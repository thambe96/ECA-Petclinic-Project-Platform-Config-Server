server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:12500/doctordb
    username: postgres
    password: psql
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

storage:
  type: gcp
  upload-dir: uploads/profile-pictures
  gcp:
    bucket-name: pet-clinic-doctor-pictures
    project-id: pet-clinic-gcp-project
